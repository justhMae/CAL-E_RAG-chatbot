<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City of Calamba | CAL-E Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css" />
</head>

<body>
  <div class="app">

    <!-- splash / welcome screen -->
    <section id="splash" class="splash">
      <div class="splash-brand">
        <img src="static/assets/seal.png" alt="Republic of the Philippines — City of Calamba" class="brand-lockup" />
      </div>

      <div class="splash-mascot-wrap">
        <img src="static/assets/mascot.png" alt="CAL-E mascot" class="splash-mascot" />
      </div>

      <button id="start-chat" class="lets-talk-btn" type="button">Let's talk!</button>
    </section>

    <!-- scrim behind drawer -->
    <div id="scrim" class="scrim"></div>

    <!-- side drawer -->
    <aside id="drawer" class="drawer">
      <div class="drawer-header">
        <div class="drawer-brand">
          <img src="static/assets/mascot.png" alt="CAL-E" class="drawer-avatar" />
          <span class="drawer-title">CAL-E</span>
        </div>
        <button id="drawer-search-btn" class="icon-btn icon-btn--outline" type="button" aria-label="Search chats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2" />
            <path d="M21 21l-4.3-4.3" stroke="white" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <span>Start new chat</span>
      </button>

      <div id="history-search-wrap" class="history-search-wrap hidden">
        <input id="history-search-input" class="history-search-input" type="text" placeholder="Search chat history"
          aria-label="Search chat history" />
      </div>

      <div class="drawer-section-label">Chat history</div>
      <ul id="history-list" class="history-list">
        <!-- history items injected here -->
      </ul>
    </aside>

    <!-- main chat view -->
    <section id="chat-screen" class="chat-screen hidden">
      <header class="app-header">
        <button id="menu-btn" class="icon-btn" type="button" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="#0F188D" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </button>

        <img src="static/assets/seal.png" alt="Republic of the Philippines — City of Calamba"
          class="brand-lockup header-lockup" />
      </header>

      <main id="chat-window" class="chat-window">
        <!-- hero shown only when conversation is empty -->
        <div id="hero" class="hero">
          <div class="hero-mascot">
            <img src="static/assets/mascot.png" alt="CAL-E mascot" />
          </div>
          <p class="hero-greeting">Hello Calambeño, what would you like to ask CAL-E today?</p>
        </div>

        <!-- conversation turns injected here -->
        <div id="messages" class="messages"></div>
      </main>

      <div class="bottom-bar">
        <div class="chips-row" id="chips-row">
          <!-- category chips loaded from /api/categories -->
        </div>

        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" placeholder="Ask CAL-E" autocomplete="off" required />
          <button type="submit" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="white" stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </form>
      </div>
    </section>
  </div>

  <script src="static/script.js"></script>
</body>

</html>
